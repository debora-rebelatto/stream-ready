name: Automated Quality Check

on:
  schedule:
    # Runs every 2 hours at minute 17 (00:17, 02:17, 04:17, ... UTC)
    # Off-peak minute avoids GitHub Actions top-of-hour (:00) queue congestion and dropped runs
    - cron: '17 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  check-quality:
    name: Trigger Quality Tracker
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Cron Request to Vercel (with Retry)
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://stremiowatchlist.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering background quality check at ${APP_URL}/api/cron..."

          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          fi

          MAX_RETRIES=3
          RETRY_DELAY=15
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            echo "Attempt ${ATTEMPT} of ${MAX_RETRIES}..."

            RESPONSE=$(curl -s --max-time 60 -w "\nHTTP_STATUS:%{http_code}" -X GET "${APP_URL}/api/cron" \
              ${AUTH_HEADER:+-H "$AUTH_HEADER"} || echo -e "\nHTTP_STATUS:000")

            HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1 | cut -d':' -f2)

            echo "Response Body: $HTTP_BODY"
            echo "HTTP Status: $HTTP_STATUS"

            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Quality check successfully completed on attempt ${ATTEMPT}!"
              exit 0
            fi

            echo "::warning::Attempt ${ATTEMPT} failed with HTTP status ${HTTP_STATUS}."

            if [ $ATTEMPT -lt $MAX_RETRIES ]; then
              echo "Waiting ${RETRY_DELAY}s before retrying..."
              sleep $RETRY_DELAY
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "::error::Quality check request failed after ${MAX_RETRIES} attempts (last HTTP status: ${HTTP_STATUS})"
          exit 1
