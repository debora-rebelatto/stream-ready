<svg width="500" height="750" viewBox="0 0 500 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1338"/>
      <stop offset="50%" stop-color="#0e1122"/>
      <stop offset="100%" stop-color="#070913"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="500" height="750" rx="24"/>
    </clipPath>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="750" fill="url(#bgGrad)" rx="24"/>
  <rect x="10" y="10" width="480" height="730" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-opacity="0.4" rx="20"/>

  <g clip-path="url(#cardClip)">
    <!-- Primary Action: Direct Scan Notice in Maximum Size -->
    <rect x="20" y="35" width="460" height="145" rx="22" fill="url(#btnGrad)"/>
    <text x="250" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">SCAN QR CODE</text>

    <!-- Edge-to-edge Scannable QR Code without lateral spacing -->
    <rect x="0" y="215" width="500" height="500" fill="#ffffff"/>
    <image href="data:image/png;base64," x="0" y="215" width="500" height="500"/>
  </g>
</svg>